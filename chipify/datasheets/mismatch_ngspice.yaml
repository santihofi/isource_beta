parameters:
  temp: [-40, 27, 100]
  seed: range(100)
  vdd: [3.3]
  sigma: [1]
  corner_mos: ['tt_mismatch', 'ss_mismatch', 'ff_mismatch', 'sf_mismatch', 'fs_mismatch']
  ibias: ['1u']
  corner_res: ['stat_mismatch']
  w_load: ['5u']
tests:
  tb_isource_beta_op:
    iout:
      min: 8.0e-07
      max: 1.2e-06
      typ: 1.0e-06
      unit: 'A'
    out: {}
    idd: {}
equations:
  vd_tr: outp-outn
transient_equations:
  out_d: outp-outn
reports:
  formats: [png]
  pdf: true
  plots: [{type: histogram, param: op1.vos, fit: Gauss (Normal), bins: Auto, formats: [
        png]}, {type: histogram, param: gain, fit: Gauss (Normal), bins: Auto, group: vincm,
      formats: [png]}, {type: histogram, param: UGF, fit: Gauss (Normal), bins: Auto,
      formats: [png]}, {type: histogram, param: phase_margin, fit: Gauss (Normal),
      bins: Auto, group: vincm, formats: [png]}, {type: scatter, x: op1.gm_pmos, y: op1.gm_nmos,
      formats: [png]}, {type: transient, runs: all_valid, signals: [out_psr], formats: [
        png]}, {type: transient, runs: all_valid, signals: [in_rect, out_rect], formats: [
        png]}, {type: dc, runs: all_valid, signals: [in_dc, out_dc], formats: [png]}]
